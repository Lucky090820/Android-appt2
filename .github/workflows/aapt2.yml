name: aapt2

on:
  workflow_dispatch:
    inputs:
      tools_tag:
        description: "构建脚手架版本（android-sdk-tools tag）"
        default: "35.0.2"
        required: false
  push:
    tags:
      - "aapt2-*"

permissions:
  contents: write
  issues: write

env:
  TOOLS_TAG: ${{ inputs.tools_tag || '35.0.2' }}
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build bison flex patch unzip file

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: 安装 NDK r27c
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: 恢复源码缓存
        uses: actions/cache@v4
        with:
          path: |
            .work/src
            .work/protoc
            !.work/src/src/**/.git
          key: aapt2-src-${{ inputs.aosp_tag || 'platform-tools-35.0.2' }}-v2

      - name: 构建 aapt2
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          AOSP_TAG: ${{ inputs.aosp_tag || 'platform-tools-35.0.2' }}
          LOG: build.log
        run: bash scripts/build-aapt2.sh

      - name: 失败时把日志发成 issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -120 build.log > /tmp/tail.log || true
          gh issue create             --title "CI failed: run ${{ github.run_id }}"             --body-file /tmp/tail.log || true

      - name: 校验
        run: |
          file out/artifact/aapt2
          sha256sum out/artifact/aapt2
          ls -lh out/artifact/aapt2

      - uses: actions/upload-artifact@v4
        with:
          name: aapt2-aarch64
          path: out/artifact/
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/artifact/*
          tag_name: ${{ github.ref_name }}
          body: "静态 aapt2（arm64 / bionic），由 AOSP 源码 + NDK r27c 构建"
